name: WinCC OA Syntax Check

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        # Required if your WinCC OA image is private
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Pull WinCC OA image
        run: docker pull ghcr.io/winccoa-tools-pack/winccoa:3.21

      - name: Run syntax check
        uses: ./.github/actions/winccoa-syntax-check
        with:
          path: "src/winccoa-ctrltf-UI"
          winccoa-version: "3.21"
          docker-image: "ghcr.io/winccoa-tools-pack/winccoa:3.21"
          fail-on-error: "true"
          mode: "all"
          integrity: "false"
          timeout-ms: "60000"
